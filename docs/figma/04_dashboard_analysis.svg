<svg width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', sans-serif">
  <g id="Background">
    <rect x="0" y="0" width="1280" height="800" fill="#09090b"/>
  </g>

  <g id="TitleBar">
    <rect x="0" y="0" width="1280" height="32" fill="#18181b"/>
    <rect x="0" y="31" width="1280" height="1" fill="#27272a"/>
    <text x="16" y="20" font-size="11" fill="#a1a1aa" opacity="0.7">test (Copy) (Copy) — Dashboard</text>
    <g id="WindowControls">
      <rect x="1194" y="10" width="12" height="12" fill="none" stroke="#a1a1aa" stroke-width="1"/>
      <rect x="1222" y="10" width="12" height="12" fill="none" stroke="#a1a1aa" stroke-width="1"/>
      <path d="M1250 10 L1262 22 M1262 10 L1250 22" stroke="#a1a1aa" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>

  <g id="ChartPanel">
    <rect x="12" y="44" width="820" height="336" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <g id="ChartHeader">
      <path d="M32 60 l-8 8 l8 8" stroke="#a1a1aa" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="73" font-size="14" font-weight="600" fill="#fafafa">Sensor Readings</text>
      <rect x="176" y="61" width="70" height="18" rx="4" fill="#27272a"/>
      <text x="211" y="74" font-size="9.5" fill="#a1a1aa" text-anchor="middle">MEAN (1H)</text>
      <rect x="252" y="61" width="118" height="18" rx="4" fill="#27272a"/>
      <text x="311" y="74" font-size="9.5" fill="#a1a1aa" text-anchor="middle">159,264 Points</text>

      <g id="ChartTypeTabs">
        <rect x="612" y="58" width="200" height="24" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
        <rect x="614" y="60" width="64" height="20" rx="5" fill="#3b82f6"/>
        <text x="646" y="74" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Line</text>
        <text x="712" y="74" font-size="11" fill="#71717a" text-anchor="middle">Scatter</text>
        <text x="778" y="74" font-size="11" fill="#71717a" text-anchor="middle">Pair Plot</text>
      </g>
    </g>

    <g id="ChartCanvas">
      <line x1="52" y1="264" x2="784" y2="264" stroke="#27272a" stroke-width="1"/>
      <line x1="52" y1="100" x2="52" y2="264" stroke="#27272a" stroke-width="1"/>
      <polyline points="52,220 100,190 148,205 196,160 244,175 292,140 340,155 388,120 436,145 484,110 532,130 580,100 628,150 676,120 724,165 772,135" fill="none" stroke="#3b82f6" stroke-width="1.6"/>
      <polyline points="52,240 100,235 148,245 196,225 244,230 292,215 340,222 388,205 436,218 484,200 532,210 580,195 628,225 676,210 724,232 772,218" fill="none" stroke="#10b981" stroke-width="1.6"/>
      <polyline points="52,180 100,170 148,190 196,150 244,165 292,120 340,140 388,100 436,130 484,95 532,120 580,90 628,140 676,105 724,150 772,115" fill="none" stroke="#f59e0b" stroke-width="1.4" opacity="0.85"/>
    </g>

    <g id="ChartBottomBar">
      <rect x="12" y="326" width="796" height="42" fill="#09090b" stroke="#27272a" stroke-width="1" rx="0"/>
      <text x="30" y="343" font-size="9.5" font-weight="600" fill="#71717a" letter-spacing="0.05em">TIME RANGE</text>
      <rect x="30" y="349" width="150" height="18" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="38" y="362" font-size="9.5" fill="#a1a1aa">2025-01-01 00:00</text>
      <text x="188" y="362" font-size="10" fill="#71717a">–</text>
      <rect x="198" y="349" width="150" height="18" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="206" y="362" font-size="9.5" fill="#a1a1aa">2025-06-30 23:00</text>
      <g id="RelativeUnitToggles">
        <rect x="360" y="349" width="18" height="18" rx="4" fill="#3b82f6"/>
        <text x="369" y="362" font-size="9" fill="#fff" text-anchor="middle" font-weight="700">H</text>
        <rect x="382" y="349" width="18" height="18" rx="4" fill="none" stroke="#27272a"/>
        <text x="391" y="362" font-size="9" fill="#71717a" text-anchor="middle">D</text>
        <rect x="404" y="349" width="18" height="18" rx="4" fill="none" stroke="#27272a"/>
        <text x="413" y="362" font-size="9" fill="#71717a" text-anchor="middle">W</text>
      </g>
    </g>
  </g>

  <g id="ControlChartPanel">
    <rect x="12" y="392" width="820" height="396" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <g id="ControlChartTabs">
      <text x="32" y="414" font-size="13" font-weight="600" fill="#3b82f6">Selected Sensor (3)</text>
      <rect x="30" y="420" width="140" height="2" fill="#3b82f6"/>
      <text x="184" y="414" font-size="13" fill="#71717a">Data Insight</text>
      <line x1="12" y1="428" x2="832" y2="428" stroke="#27272a" stroke-width="1"/>
      <rect x="700" y="402" width="70" height="18" rx="9" fill="#27272a"/>
      <text x="735" y="415" font-size="9.5" fill="#a1a1aa" text-anchor="middle">159,264 Rows</text>
    </g>

    <g id="SensorRow1">
      <rect x="24" y="444" width="784" height="52" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <circle cx="40" cy="470" r="6" fill="#3b82f6"/>
      <text x="56" y="465" font-size="12" font-weight="600" fill="#fafafa">850P402.PV</text>
      <text x="56" y="481" font-size="10.5" fill="#71717a">Compressor Discharge Pressure</text>
      <rect x="700" y="458" width="24" height="24" rx="5" fill="#27272a"/>
      <rect x="732" y="458" width="24" height="24" rx="5" fill="#27272a"/>
      <rect x="764" y="458" width="24" height="24" rx="5" fill="#27272a"/>
    </g>
    <g id="SensorRow2">
      <rect x="24" y="504" width="784" height="52" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <circle cx="40" cy="530" r="6" fill="#10b981"/>
      <text x="56" y="525" font-size="12" font-weight="600" fill="#fafafa">850T118.PV</text>
      <text x="56" y="541" font-size="10.5" fill="#71717a">Bearing Temperature — DE side</text>
      <rect x="700" y="518" width="24" height="24" rx="5" fill="#27272a"/>
      <rect x="732" y="518" width="24" height="24" rx="5" fill="#27272a"/>
      <rect x="764" y="518" width="24" height="24" rx="5" fill="#27272a"/>
    </g>
    <g id="SensorRow3">
      <rect x="24" y="564" width="784" height="52" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <circle cx="40" cy="590" r="6" fill="#f59e0b"/>
      <text x="56" y="585" font-size="12" font-weight="600" fill="#fafafa">11PT1220.PV</text>
      <text x="56" y="601" font-size="10.5" fill="#71717a">Suction Line Pressure</text>
      <rect x="700" y="578" width="24" height="24" rx="5" fill="#27272a"/>
      <rect x="732" y="578" width="24" height="24" rx="5" fill="#27272a"/>
      <rect x="764" y="578" width="24" height="24" rx="5" fill="#27272a"/>
    </g>
  </g>

  <g id="SensorsPanel">
    <rect x="844" y="44" width="424" height="336" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="864" y="72" font-size="14" font-weight="600" fill="#fafafa">Sensor</text>
    <rect x="920" y="60" width="80" height="18" rx="4" fill="#27272a"/>
    <text x="960" y="73" font-size="9.5" fill="#a1a1aa" text-anchor="middle">132 Sensors</text>
    <rect x="864" y="90" width="384" height="30" rx="7" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    <text x="878" y="109" font-size="11.5" fill="#52525b">Search sensors…</text>

    <text x="864" y="140" font-size="10" font-weight="600" fill="#71717a" letter-spacing="0.05em">COMPRESSOR</text>
    <g id="SensorChecklist">
      <rect x="864" y="150" width="384" height="26" rx="6" fill="rgba(59,130,246,0.1)"/>
      <rect x="874" y="158" width="12" height="12" rx="3" fill="#3b82f6"/>
      <text x="896" y="167" font-size="11" fill="#fafafa">850P402.PV — Compressor Discharge Pressure</text>

      <rect x="864" y="180" width="384" height="26" rx="6" fill="rgba(59,130,246,0.1)"/>
      <rect x="874" y="188" width="12" height="12" rx="3" fill="#3b82f6"/>
      <text x="896" y="197" font-size="11" fill="#fafafa">850T118.PV — Bearing Temperature DE</text>

      <rect x="864" y="210" width="384" height="26" rx="6" fill="none"/>
      <rect x="874" y="218" width="12" height="12" rx="3" fill="none" stroke="#3f3f46" stroke-width="1.3"/>
      <text x="896" y="227" font-size="11" fill="#a1a1aa">850T119.PV — Bearing Temperature NDE</text>

      <rect x="864" y="240" width="384" height="26" rx="6" fill="none"/>
      <rect x="874" y="248" width="12" height="12" rx="3" fill="none" stroke="#3f3f46" stroke-width="1.3"/>
      <text x="896" y="257" font-size="11" fill="#a1a1aa">850V201.PV — Vibration — Axial</text>
    </g>

    <text x="864" y="292" font-size="10" font-weight="600" fill="#71717a" letter-spacing="0.05em">SUCTION LINE</text>
    <g id="SensorChecklist2">
      <rect x="864" y="302" width="384" height="26" rx="6" fill="rgba(59,130,246,0.1)"/>
      <rect x="874" y="310" width="12" height="12" rx="3" fill="#3b82f6"/>
      <text x="896" y="319" font-size="11" fill="#fafafa">11PT1220.PV — Suction Line Pressure</text>
    </g>

    <g id="AddSpecialSensorBtn">
      <rect x="864" y="346" width="384" height="26" rx="7" fill="none" stroke="#27272a" stroke-width="1"/>
      <path d="M1044 355 v8 M1040 359 h8" stroke="#a1a1aa" stroke-width="1.4" stroke-linecap="round"/>
      <text x="1062" y="363" font-size="11" fill="#a1a1aa">Add Special Sensor</text>
    </g>
  </g>

  <g id="FilterPanel">
    <rect x="844" y="392" width="424" height="300" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="864" y="420" font-size="14" font-weight="600" fill="#fafafa">Filter &amp; Controls</text>

    <text x="864" y="450" font-size="10" font-weight="600" fill="#71717a" letter-spacing="0.05em">SAMPLING</text>
    <rect x="864" y="458" width="180" height="26" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    <text x="878" y="475" font-size="11" fill="#fafafa">Mean · 1 hour</text>

    <text x="864" y="504" font-size="10" font-weight="600" fill="#71717a" letter-spacing="0.05em">SENSOR VALUE FILTERS</text>
    <rect x="864" y="512" width="384" height="46" rx="7" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    <text x="876" y="530" font-size="10.5" fill="#a1a1aa">850P402.PV</text>
    <rect x="980" y="521" width="44" height="18" rx="4" fill="rgba(59,130,246,0.15)"/>
    <text x="1002" y="534" font-size="10" fill="#60a5fa" text-anchor="middle">&gt;</text>
    <rect x="1030" y="521" width="50" height="18" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="1055" y="534" font-size="10" fill="#a1a1aa" text-anchor="middle">120</text>
    <path d="M1200 526 L1210 536 M1210 526 L1200 536" stroke="#71717a" stroke-width="1.3" stroke-linecap="round"/>

    <rect x="864" y="566" width="384" height="24" rx="6" fill="none" stroke="#27272a" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="1056" y="582" font-size="10.5" fill="#71717a" text-anchor="middle">+ Add filter</text>

    <text x="864" y="628" font-size="10" font-weight="600" fill="#71717a" letter-spacing="0.05em">OPERATION</text>
    <rect x="864" y="636" width="384" height="26" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    <text x="878" y="653" font-size="11" fill="#fafafa">None</text>
  </g>

  <g id="CreateFailureGroupSection">
    <rect x="844" y="700" width="424" height="1" fill="#27272a"/>
    <rect x="844" y="716" width="424" height="40" rx="8" fill="#3b82f6"/>
    <path d="M1030 730 v12 M1024 736 h12" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <text x="1046" y="740" font-size="13" font-weight="600" fill="#ffffff">Create Failure Group</text>
  </g>
</svg>
