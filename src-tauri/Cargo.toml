[package]
name = "tauri-app"
version = "0.13.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-dialog = "2"
rayon = "1.10"
tauri-plugin-shell = "2.3.4"
tauri-plugin-store = "2"
tauri-plugin-fs = "2.4.5"
fasteval = "0.2"
nalgebra = "0.33"
# HMAC for signed sidecar requests (already in the tree through tauri).
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

# Keep `tauri dev` interactive on multi-million-row CSVs: the dashboard's
# data pipeline (filter/aggregate/decimate in chart_query.rs) is hot Rust
# code that runs 10-50x slower at opt-level 0. Light optimization for our
# crate, full optimization for dependencies (compiled once, then cached).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Installer builds: make the shipped .exe harder to reverse-engineer.
# strip removes symbol names; lto + one codegen unit merge and inline the
# whole program so its structure is harder to follow. Developer paths are
# hidden by --remap-path-prefix in scripts/build-installer-windows.ps1.
# panic stays "unwind" on purpose: "abort" would close the whole app on a
# panic inside a single command.
[profile.release]
strip = true
lto = true
codegen-units = 1

