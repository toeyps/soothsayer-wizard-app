<svg width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', sans-serif">
  <g id="Background">
    <rect x="0" y="0" width="1280" height="800" fill="#09090b"/>
  </g>

  <g id="TitleBar">
    <rect x="0" y="0" width="1280" height="32" fill="#18181b"/>
    <rect x="0" y="31" width="1280" height="1" fill="#27272a"/>
    <text x="16" y="20" font-size="11" fill="#a1a1aa" opacity="0.7">Wizard</text>
    <g id="WindowControls">
      <rect x="1194" y="10" width="12" height="12" fill="none" stroke="#a1a1aa" stroke-width="1"/>
      <rect x="1222" y="10" width="12" height="12" fill="none" stroke="#a1a1aa" stroke-width="1"/>
      <path d="M1250 10 L1262 22 M1262 10 L1250 22" stroke="#a1a1aa" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>

  <g id="Sidebar">
    <rect x="0" y="32" width="240" height="768" fill="#09090b"/>
    <rect x="240" y="32" width="1" height="768" fill="#27272a"/>
    <rect x="16" y="52" width="208" height="30" rx="7" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="30" y="71" font-size="12" fill="#71717a">Find workspace…</text>
    <text x="16" y="106" font-size="10.5" font-weight="600" fill="#71717a" letter-spacing="0.05em">RECENT</text>
  </g>

  <g id="StepIndicator">
    <circle cx="272" cy="66" r="9" fill="#3b82f6"/>
    <path d="M268 66 l3 3 l6 -7" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="288" y="70" font-size="13" font-weight="600" fill="#fafafa">Create project</text>
    <rect x="400" y="65" width="60" height="1.5" fill="#27272a"/>
    <circle cx="472" cy="66" r="9" fill="none" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="472" y="70" font-size="10" fill="#a1a1aa" text-anchor="middle">2</text>
    <text x="488" y="70" font-size="13" fill="#71717a">Prepare dataset</text>
  </g>

  <g id="Header">
    <text x="272" y="118" font-size="24" font-weight="700" fill="#fafafa">Create your project</text>
    <text x="272" y="142" font-size="12.5" fill="#a1a1aa">Name your project first — this becomes the workspace everything downstream</text>
    <text x="272" y="158" font-size="12.5" fill="#a1a1aa">(data, mappings, results) is filed under.</text>
  </g>

  <g id="FormCard">
    <rect x="272" y="188" width="600" height="240" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>

    <g id="ProjectNameField">
      <text x="296" y="220" font-size="13" font-weight="600" fill="#fafafa">Project name</text>
      <text x="382" y="220" font-size="11" font-weight="600" fill="#f59e0b">required</text>
      <rect x="296" y="232" width="552" height="38" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <text x="308" y="256" font-size="13" fill="#52525b">e.g. Compressor Line 3 — Q3 Baseline</text>
    </g>

    <g id="DescriptionField">
      <text x="296" y="298" font-size="13" font-weight="600" fill="#fafafa">Description</text>
      <text x="378" y="298" font-size="11" fill="#71717a">optional</text>
      <rect x="296" y="310" width="552" height="90" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <text x="308" y="332" font-size="13" fill="#52525b">What is this workspace for?</text>
    </g>
  </g>

  <g id="BottomBar">
    <rect x="240" y="756" width="1040" height="1" fill="#27272a"/>
    <text x="272" y="785" font-size="11" fill="#71717a" font-family="'JetBrains Mono', monospace" letter-spacing="0.04em">Enter a project name to continue</text>
    <g id="BackButton">
      <rect x="1032" y="762" width="90" height="34" rx="8" fill="none" stroke="#27272a" stroke-width="1"/>
      <text x="1077" y="784" font-size="13" font-weight="500" fill="#a1a1aa" text-anchor="middle">‹ Back</text>
    </g>
    <g id="ContinueButton">
      <rect x="1132" y="762" width="116" height="34" rx="8" fill="#3f3f46" stroke="#27272a" stroke-width="1"/>
      <text x="1190" y="784" font-size="13" font-weight="600" fill="#a1a1aa" text-anchor="middle">Continue →</text>
    </g>
  </g>
</svg>
